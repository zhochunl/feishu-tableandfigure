<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="临床试验三线表插件头像">
  <rect width="240" height="240" fill="#fffafc" />

  <!-- 三线表的三条线：顶线、栏目线、底线 -->
  <path d="M28 42H212" stroke="#6b5560" stroke-width="5.5" />
  <path d="M28 78H212" stroke="#6b5560" stroke-width="3" />
  <path d="M28 204H212" stroke="#6b5560" stroke-width="5.5" />

  <!-- 表头 -->
  <rect x="38" y="54" width="46" height="10" fill="#d4c6cd" />
  <rect x="170" y="54" width="40" height="10" fill="#d4c6cd" />

  <!-- 第一层 AESOC -->
  <rect x="38" y="92" width="60" height="12" fill="#8b7580" />
  <rect x="168" y="92" width="42" height="12" fill="#c2477d" />

  <!-- 第二层 AEPT，缩进 -->
  <rect x="58" y="118" width="46" height="12" fill="#b39ca7" />
  <rect x="176" y="118" width="34" height="12" fill="#f3a9c4" />

  <!-- 选中的一层：可点数字钻取到记录 -->
  <rect x="32" y="140" width="176" height="22" fill="#fdeef4" />
  <rect x="58" y="145" width="50" height="12" fill="#b39ca7" />
  <rect x="176" y="145" width="34" height="12" fill="#c2477d" />
  <rect x="171.5" y="140.5" width="43" height="21" fill="none" stroke="#f3a9c4" stroke-width="2.5" />

  <rect x="38" y="176" width="54" height="12" fill="#8b7580" />
  <rect x="168" y="176" width="42" height="12" fill="#c2477d" />
</svg>
